name: Manual Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null)
          if [ -z "$TAG" ]; then
            echo "No tag found"
            exit 1
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@11
      - run: npm --version

      - run: npm install
      - run: npm run build
      - run: npm version ${{ steps.tag.outputs.version }} -f --no-git-tag-version
      # Authenticates via npm trusted publishing (OIDC, `id-token: write`);
      # no NPM_TOKEN secret is used. The trusted publisher for this package
      # must be configured on npmjs.com with this workflow file name.
      - run: npm publish
